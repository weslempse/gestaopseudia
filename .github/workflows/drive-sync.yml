name: Drive Sync and ETL
on: schedule: - cron: '0 */6 * * *' workflow_dispatch: {}
jobs: sync-and-etl: runs-on: ubuntu-latest steps: - name: Checkout repo uses: actions/checkout@v4 - name: Setup Python uses: actions/setup-python@v4 with: python-version: '3.11' - name: Install deps run: | python -m pip install --upgrade pip pip install -r requirements.txt - name: Write Google service account JSON env: GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }} run: | mkdir -p ./secrets echo "$GSA_JSON" > ./secrets/gdrive-sa.json chmod 600 ./secrets/gdrive-sa.json - name: Export env vars run: | echo "GOOGLE_SERVICE_ACCOUNT_FILE=./secrets/gdrive-sa.json" >> $GITHUB_ENV echo "GOOGLE_DRIVE_ROOT_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}" >> $GITHUB_ENV echo "DATABASE_URL=${{ secrets.SUPABASE_DATABASE_URL }}" >> $GITHUB_ENV echo "INCOMING_DIR=./data/incoming" >> $GITHUB_ENV - name: Run Drive sync and ETL run: | python tools/drive_sync.py
