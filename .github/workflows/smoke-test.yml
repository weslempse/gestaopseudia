name: Smoke Test (DB + Service Account)

on:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install lightweight deps
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Write Google service account JSON
        env:
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p ./secrets
          echo "$GSA_JSON" > ./secrets/gdrive-sa.json
          chmod 600 ./secrets/gdrive-sa.json

      - name: Export env vars
        run: |
          echo "GOOGLE_SERVICE_ACCOUNT_FILE=./secrets/gdrive-sa.json" >> $GITHUB_ENV
          echo "SUPABASE_DATABASE_URL=${{ secrets.SUPABASE_DATABASE_URL }}" >> $GITHUB_ENV

      - name: Run debug smoke script
        run: |
          python tools/debug_smoke.py
